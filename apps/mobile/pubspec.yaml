name: mobile
description: Keyt school management mobile app (Student + Teacher + Parent).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.4
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  go_router: ^18.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
